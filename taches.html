<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurore Task a déménagé</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#373737">
<style>
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#f8f8f8;color:#111;font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:420px;margin:16px;padding:20px;background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
h1{margin:0 0 8px;font-size:20px}
a.btn{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:14px;background:#0b694d;color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Aurore Task a déménagé</h1>
  <p id="msg">Aurore Task a maintenant sa propre adresse. Ouverture…</p>
  <a class="btn" id="lien" href="https://aurore-task.pages.dev/">Ouvrir Aurore Task</a>
  <p>Pensez à supprimer l'ancienne icône et à installer Aurore Task depuis sa nouvelle adresse.</p>
</main>
<script src="cle-web.js"></script>
<script src="config.js"></script>
<script>
'use strict';
// Aurore Task est sortie de ce dépôt le 19/11/2026 (règle de François : un outil, un dépôt, une adresse).
// Cette page renvoie vers sa nouvelle adresse. Avant, elle envoie à la base les modifications faites ici sans
// réseau et pas encore parties (gardées sur l'appareil sous taches.pending), pour ne rien perdre.
var NOUVELLE = 'https://aurore-task.pages.dev/';
var DB = (window.RECOLTE_DB_URL || '').replace(/\/+$/, '');
var CLE = String(window.RECOLTE_CLE_WEB || '').trim();
var JETON_URL = window.RECOLTE_JETON_URL || 'https://securetoken.googleapis.com/v1';
function ls(k, v){ try{ if(v === undefined){ var x = localStorage.getItem(k); return x ? JSON.parse(x) : null; } localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
document.getElementById('lien').href = NOUVELLE;
function partir(){ location.replace(NOUVELLE); }
function renouveler(c){
  return fetch(JETON_URL + '/token?key=' + encodeURIComponent(CLE), {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(c.renouv)})
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error('jeton'); c.jeton = j.id_token; c.renouv = j.refresh_token || c.renouv; c.fin = Date.now() + (Number(j.expires_in) || 3600) * 1000; ls('recolte.compte', c); }); });
}
function envoyer(){
  var pending = ls('taches.pending') || [], c = ls('recolte.compte');
  if(!pending.length) return partir();
  if(!c || !DB || !CLE){ return bloque(); }
  var pret = c.fin - Date.now() > 60000 ? Promise.resolve() : renouveler(c);
  pret.then(function suivant(){
    var p = pending[0]; if(!p){ ls('taches.pending', []); return partir(); }
    return fetch(DB + '/taches.json?auth=' + encodeURIComponent(c.jeton), {method:'PATCH', body:JSON.stringify(p.c)}).then(function(r){
      if(!r.ok) throw new Error(r.status);
      pending.shift(); ls('taches.pending', pending); return suivant();
    });
  }).catch(bloque);
}
function bloque(){
  document.getElementById('msg').textContent = 'Des modifications faites ici sans réseau ne sont pas encore parties. Rouvrez cette page avec du réseau pour les envoyer, ou ouvrez quand même la nouvelle adresse.';
}
envoyer();
</script>
</body>
</html>
